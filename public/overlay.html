<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>W Profit Pot Overlay</title>
<style>
:root{--green:#53fc18;--purple:#9b5cf6;--muted:#c3b7d5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#fff}
.stage{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:22px}
.widget{width:min(470px,94vw);height:min(420px,92vh);min-height:340px;background:linear-gradient(155deg,#190c2bf5,#0b0613f7 70%);border:3px solid #6f3fa0;border-radius:26px;box-shadow:0 18px 65px #000a,0 0 34px #8b5cf64a,inset 0 0 34px #8b5cf610;position:relative;overflow:hidden;padding:24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.widget:before{content:"";position:absolute;inset:-120px auto auto -90px;width:300px;height:300px;border-radius:50%;background:#8b5cf616;pointer-events:none}
.widget:after{content:"";position:absolute;left:18px;right:18px;bottom:17px;height:2px;background:linear-gradient(90deg,transparent,#8b5cf6aa,transparent);pointer-events:none}
.brand{position:relative;font-size:20px;font-weight:1000;letter-spacing:2.1px;color:#fff;text-shadow:0 2px 10px #000;margin-top:2px}.brand b{display:inline-block;color:var(--green);font-size:33px;line-height:1;margin-right:7px;text-shadow:0 0 20px #53fc18a0;vertical-align:-2px}
.divider{width:78%;height:1px;background:linear-gradient(90deg,transparent,#7d48af,transparent);margin:16px 0 14px}
.potWrap{width:100%;position:relative}.label{font-size:15px;color:#d9cfea;text-transform:uppercase;letter-spacing:1.8px;font-weight:1000;text-shadow:0 2px 8px #000}.pot{font-size:66px;line-height:1.03;font-weight:1000;letter-spacing:-3px;margin-top:8px;text-shadow:0 3px 18px #000}.pot .d{color:var(--green);text-shadow:0 0 22px #53fc1880}
.meta{position:relative;margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}.metaBox{background:#10081bd9;border:2px solid #3c2356;border-radius:16px;padding:12px 8px}.meta .n{font-size:32px;line-height:1;font-weight:1000;color:#fff}.meta .t{font-size:12px;color:#d3c8e1;text-transform:uppercase;font-weight:1000;letter-spacing:1.15px;margin-top:6px}.hint{position:relative;font-size:12px;color:#b8aacb;font-weight:900;letter-spacing:.7px;margin:13px 0 3px;text-transform:uppercase}
.rollLayer{position:absolute;inset:0;background:linear-gradient(150deg,#1a0d2dfd,#090510fe 72%);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:10;padding:30px 28px}.rollLayer.show{display:flex}.rollLayer:before{content:"";position:absolute;inset:20px;border:2px solid #573276;border-radius:19px;pointer-events:none}.rolling{position:relative;font-size:19px;font-weight:1000;color:#e3d8f3;letter-spacing:2.4px;text-shadow:0 2px 10px #000}.ticker{position:relative;width:100%;font-size:clamp(38px,10vw,68px);line-height:1.05;font-weight:1000;margin-top:16px;min-height:76px;color:#fff;text-shadow:0 0 22px #8b5cf6aa,0 4px 15px #000;overflow-wrap:anywhere;word-break:break-word;display:flex;align-items:center;justify-content:center}.winner{color:var(--green);text-shadow:0 0 28px #53fc1890,0 4px 15px #000}.prize{position:relative;font-size:23px;font-weight:1000;color:#fff;margin-top:17px;line-height:1.15;padding:11px 20px;border:2px solid #4b2a69;border-radius:14px;background:#10081bd9;max-width:100%}.prize strong{color:var(--green)}.pulse{animation:pulse .6s ease-in-out infinite alternate}@keyframes pulse{from{transform:scale(.985);opacity:.78}to{transform:scale(1.015);opacity:1}}
@media(max-width:540px){.stage{padding:10px}.widget{width:min(430px,96vw);height:min(390px,95vh);padding:20px}.brand{font-size:17px}.brand b{font-size:29px}.pot{font-size:56px}.meta .n{font-size:28px}.ticker{font-size:clamp(34px,12vw,58px)}.prize{font-size:20px}}
</style>
</head>
<body>
<div class="stage">
 <div class="widget">
   <div class="brand"><b>W</b> PROFIT POT</div>
   <div class="divider"></div>
   <div class="potWrap"><div class="label">Community Giveaway Pot</div><div class="pot"><span class="d">$</span><span id="pot">0.00</span></div></div>
   <div class="meta">
     <div class="metaBox"><div class="n" id="entries">0</div><div class="t">Profit Entries</div></div>
     <div class="metaBox"><div class="n" id="callers">0</div><div class="t">Callers</div></div>
   </div>
   <div class="hint">Profitable slot calls build the pot</div>
   <div class="rollLayer" id="layer"><div class="rolling" id="rollLabel">ROLLING WINNER</div><div class="ticker pulse" id="ticker">—</div><div class="prize" id="prize"></div></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s); const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let prevRolling=false,seenWinner=0,spinTimer=null,last=[];
function startTicker(names){clearInterval(spinTimer);let i=0;$('#ticker').className='ticker pulse';$('#rollLabel').textContent='ROLLING WINNER';$('#prize').textContent='';spinTimer=setInterval(()=>{if(names.length)$('#ticker').textContent=names[i++%names.length]},85)}
function showWinner(w){clearInterval(spinTimer);$('#layer').classList.add('show');$('#rollLabel').textContent='POT WINNER';$('#ticker').className='ticker winner';$('#ticker').textContent=w.name;$('#prize').innerHTML=`WINS <strong>$${money(w.prize)}</strong>`;setTimeout(()=>{if(!prevRolling)$('#layer').classList.remove('show')},8500)}
async function tick(){try{const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());$('#pot').textContent=money(s.pot);$('#entries').textContent=s.entryCount;$('#callers').textContent=s.uniqueCallers;last=s.calls.map(c=>c.name);if(s.rolling&&!prevRolling){$('#layer').classList.add('show');startTicker(last)}if(!s.rolling&&prevRolling&&s.winner)showWinner(s.winner);if(!s.rolling&&s.winner&&s.winner.wonAt!==seenWinner){seenWinner=s.winner.wonAt;showWinner(s.winner)}if(!s.rolling&&!s.winner)$('#layer').classList.remove('show');prevRolling=s.rolling}catch(e){}}
setInterval(tick,500);tick();
</script>
</body>
</html>
