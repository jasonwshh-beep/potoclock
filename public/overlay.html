<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>W Profit Pot Overlay</title>
<style>
:root{--green:#53fc18;--purple:#9b5cf6;--purple2:#6f3fa0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:#fff}
.stage{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:6px}
.widget{width:min(335px,96vw);min-height:0;background:linear-gradient(155deg,#190c2bf8,#09050ffd 72%);border:4px solid var(--purple2);border-radius:24px;box-shadow:0 14px 42px #000a,0 0 26px #8b5cf650,inset 0 0 24px #8b5cf610;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 20px 18px;animation:borderGlow 5s ease-in-out infinite}
.widget:before{content:"";position:absolute;inset:-110px auto auto -90px;width:280px;height:280px;border-radius:50%;background:#8b5cf615;pointer-events:none}
.widget:after{content:"";position:absolute;inset:10px;border:1px solid #b778ff38;border-radius:15px;pointer-events:none}
@keyframes borderGlow{0%,72%,100%{box-shadow:0 18px 60px #000a,0 0 24px #8b5cf645,inset 0 0 28px #8b5cf610;border-color:#6f3fa0}82%{box-shadow:0 18px 60px #000a,0 0 48px #a867ff9c,inset 0 0 35px #8b5cf624;border-color:#a867ff}90%{box-shadow:0 18px 60px #000a,0 0 30px #8b5cf660,inset 0 0 30px #8b5cf618;border-color:#8550bb}}
.brand{position:relative;z-index:2;font-size:20px;font-weight:1000;letter-spacing:1.45px;color:#fff;text-shadow:0 3px 12px #000;text-transform:uppercase;white-space:nowrap;line-height:1}
.brand b{display:inline-block;color:var(--green);font-size:34px;line-height:1;margin-right:7px;text-shadow:0 0 22px #53fc18b0;vertical-align:-3px}
.divider{position:relative;z-index:2;width:78%;height:2px;background:linear-gradient(90deg,transparent,#884fbd,transparent);margin:11px 0 10px}
.pot{position:relative;z-index:2;width:100%;font-size:clamp(46px,15vw,66px);line-height:.95;font-weight:1000;letter-spacing:-3px;color:var(--green);text-shadow:0 0 22px #53fc1890,0 4px 18px #000;white-space:nowrap;padding-bottom:1px}
.added{position:absolute;z-index:8;left:50%;top:8%;transform:translate(-50%,10px) scale(.92);font-size:25px;font-weight:1000;color:#fff;background:#100819e8;border:2px solid #53fc18;border-radius:999px;padding:7px 14px;opacity:0;pointer-events:none;box-shadow:0 0 22px #53fc1865,0 5px 18px #0008;white-space:nowrap}
.added.show{animation:addPop 1.45s cubic-bezier(.2,.85,.25,1) forwards}@keyframes addPop{0%{opacity:0;transform:translate(-50%,16px) scale(.78)}18%{opacity:1;transform:translate(-50%,0) scale(1.06)}72%{opacity:1;transform:translate(-50%,-7px) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.96)}}
.spark{position:absolute;z-index:7;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #53fc18;pointer-events:none;opacity:0}.spark.go{animation:spark 900ms ease-out forwards}@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.rollLayer{position:absolute;inset:0;background:linear-gradient(150deg,#1a0d2dfe,#08040efe 72%);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:20;padding:16px 20px 18px}.rollLayer.show{display:flex}.rollLayer:before{content:"";position:absolute;inset:10px;border:2px solid #70409a;border-radius:16px;box-shadow:inset 0 0 26px #8b5cf616;pointer-events:none}
.rollLabel{position:relative;z-index:2;font-size:16px;font-weight:1000;color:#eee6f8;letter-spacing:2px;text-shadow:0 2px 9px #000;text-transform:uppercase;flex:0 0 auto}
.ticker{position:relative;z-index:2;width:100%;max-width:100%;min-height:60px;margin-top:8px;padding:0 4px;font-size:clamp(34px,13vw,62px);line-height:.98;font-weight:1000;color:#fff;text-shadow:0 0 22px #8b5cf6aa,0 4px 15px #000;overflow-wrap:anywhere;word-break:break-word;display:flex;align-items:center;justify-content:center;text-align:center}.ticker.winner{color:var(--green);text-shadow:0 0 29px #53fc18a0,0 4px 15px #000}.ticker.pulse{animation:namePulse .55s ease-in-out infinite alternate}@keyframes namePulse{from{transform:scale(.985);opacity:.78}to{transform:scale(1.015);opacity:1}}
.prize{position:relative;z-index:2;font-size:18px;font-weight:1000;color:#fff;margin-top:8px;line-height:1.05;padding:8px 13px;border:2px solid #5e367f;border-radius:14px;background:#10081be8;max-width:100%;white-space:normal}.prize:empty{display:none}.prize strong{color:var(--green);white-space:nowrap}.winner .prize{animation:prizeIn .45s .15s both}@keyframes prizeIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
@media(max-width:400px){.stage{padding:4px}.widget{width:min(310px,97vw);padding:13px 16px 15px}.brand{font-size:17px}.brand b{font-size:29px}.divider{margin:8px 0 8px}.pot{font-size:clamp(41px,16vw,57px)}.rollLayer{padding:13px 16px 15px}.ticker{font-size:clamp(28px,13vw,48px);min-height:54px;margin-top:6px}.prize{font-size:17px;margin-top:6px;padding:7px 11px}}
</style>
</head>
<body>
<div class="stage">
  <div class="widget" id="widget">
    <div class="brand"><b>W</b> PROFIT POT</div>
    <div class="divider"></div>
    <div class="pot" id="pot">$0.00</div>
    <div class="added" id="added">+$0.00</div>
    <div class="rollLayer" id="layer">
      <div class="rollLabel" id="rollLabel">ROLLING WINNER</div>
      <div class="ticker pulse" id="ticker">—</div>
      <div class="prize" id="prize"></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
let prevRolling=false, seenWinner=0, spinTimer=null, last=[], currentPot=null, displayPot=0, potAnim=null, initialized=false;

function fitWinnerName(){
  const el=$('#ticker');
  let size=Math.min(62,Math.max(32,350/(Math.max(4,el.textContent.length)*.58)));
  el.style.fontSize=size+'px';
  requestAnimationFrame(()=>{let tries=0;while((el.scrollHeight>105||el.scrollWidth>el.clientWidth+2)&&size>27&&tries++<20){size-=2;el.style.fontSize=size+'px'}});
}
function startTicker(names){
  clearInterval(spinTimer);let i=0;$('#ticker').style.fontSize='';$('#ticker').className='ticker pulse';$('#rollLabel').textContent='ROLLING WINNER';$('#prize').textContent='';
  if(names.length){$('#ticker').textContent=names[0];fitWinnerName()}
  spinTimer=setInterval(()=>{if(names.length){$('#ticker').textContent=names[i++%names.length];fitWinnerName()}},85)
}

function showWinner(w){
  clearInterval(spinTimer);$('#layer').classList.add('show');$('#rollLabel').textContent='POT WINNER';$('#ticker').className='ticker winner';$('#ticker').textContent=w.name;fitWinnerName();$('#prize').innerHTML=`WINS <strong>$${money(w.prize)}</strong>`;
  setTimeout(()=>{if(!prevRolling)$('#layer').classList.remove('show')},8500)
}
function animatePot(from,to){
  cancelAnimationFrame(potAnim);const el=$('#pot');const start=performance.now(),dur=1100;const diff=to-from;
  function frame(now){const p=Math.min(1,(now-start)/dur);const eased=1-Math.pow(1-p,3);displayPot=from+diff*eased;el.textContent='$'+money(displayPot);if(p<1)potAnim=requestAnimationFrame(frame);else{displayPot=to;el.textContent='$'+money(to)}}
  potAnim=requestAnimationFrame(frame)
}
function casinoTick(){
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=620;g.gain.setValueAtTime(.025,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.045);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.05);setTimeout(()=>ctx.close(),100)}catch(e){}
}
function sparkles(){
  const w=$('#widget');for(let i=0;i<12;i++){const s=document.createElement('i');s.className='spark';const ang=(Math.PI*2*i/12)+(Math.random()*.3);const r=70+Math.random()*55;s.style.left=(48+Math.random()*4)+'%';s.style.top=(53+Math.random()*5)+'%';s.style.setProperty('--dx',Math.cos(ang)*r+'px');s.style.setProperty('--dy',Math.sin(ang)*r+'px');w.appendChild(s);requestAnimationFrame(()=>s.classList.add('go'));setTimeout(()=>s.remove(),1000)}}
function showAdded(diff){
  const a=$('#added');a.textContent='+$'+money(diff);a.classList.remove('show');void a.offsetWidth;a.classList.add('show');sparkles();
  let n=0;const t=setInterval(()=>{casinoTick();if(++n>=7)clearInterval(t)},120)
}
async function tick(){
  try{
    const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());const next=Number(s.pot||0);last=s.calls.map(c=>c.name);
    if(!initialized){initialized=true;currentPot=next;displayPot=next;$('#pot').textContent='$'+money(next)}
    else if(next!==currentPot){const old=currentPot;currentPot=next;animatePot(displayPot,next);if(next>old)showAdded(next-old)}
    if(s.rolling&&!prevRolling){$('#layer').classList.add('show');startTicker(last)}
    if(!s.rolling&&prevRolling&&s.winner)showWinner(s.winner);
    if(!s.rolling&&s.winner&&s.winner.wonAt!==seenWinner){seenWinner=s.winner.wonAt;showWinner(s.winner)}
    if(!s.rolling&&!s.winner)$('#layer').classList.remove('show');prevRolling=s.rolling
  }catch(e){}
}
setInterval(tick,500);tick();
</script>
</body>
</html>
