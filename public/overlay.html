<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>W Profit Pot Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#fff}.stage{width:100%;height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:26px;box-sizing:border-box}.widget{width:min(980px,92vw);background:linear-gradient(120deg,#160b27f2,#0d0717f4);border:2px solid #5f3983;border-radius:24px;box-shadow:0 16px 70px #0009,0 0 36px #8b5cf62b;display:grid;grid-template-columns:220px 1fr 210px;align-items:center;gap:22px;padding:18px 24px;position:relative;overflow:hidden}.widget:before{content:"";position:absolute;inset:-120px auto auto -80px;width:300px;height:300px;border-radius:50%;background:#8b5cf616}.brand{position:relative;font-size:14px;font-weight:1000;letter-spacing:2px;color:#bda8df}.brand b{display:block;font-size:36px;line-height:1;color:#53fc18;text-shadow:0 0 18px #53fc1880;letter-spacing:-1px}.potWrap{text-align:center;position:relative}.label{font-size:11px;color:#a89db6;text-transform:uppercase;letter-spacing:1.7px;font-weight:900}.pot{font-size:52px;line-height:1.05;font-weight:1000;letter-spacing:-2px;margin-top:3px}.pot .d{color:#53fc18}.meta{text-align:right;position:relative}.meta .n{font-size:29px;font-weight:1000}.meta .t{font-size:11px;color:#a89db6;text-transform:uppercase;font-weight:900;letter-spacing:1.2px}.rollLayer{position:absolute;inset:0;background:linear-gradient(135deg,#160c27fb,#0b0613fc);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:10}.rollLayer.show{display:flex}.rolling{font-size:24px;font-weight:1000;color:#cbb8ee;letter-spacing:2px}.ticker{font-size:54px;font-weight:1000;margin-top:7px;min-height:65px;color:#fff;text-shadow:0 0 22px #8b5cf699}.winner{color:#53fc18;text-shadow:0 0 28px #53fc1888}.prize{font-size:18px;font-weight:800;color:#d7ccec;margin-top:4px}.pulse{animation:pulse .6s ease-in-out infinite alternate}@keyframes pulse{from{transform:scale(.98);opacity:.72}to{transform:scale(1.02);opacity:1}}
@media(max-width:700px){.widget{grid-template-columns:1fr;text-align:center}.meta{text-align:center}.brand b{font-size:30px}.pot{font-size:42px}}
</style>
</head>
<body>
<div class="stage">
 <div class="widget">
   <div class="brand"><b>W</b> PROFIT POT</div>
   <div class="potWrap"><div class="label">Community Giveaway Pot</div><div class="pot"><span class="d">$</span><span id="pot">0.00</span></div></div>
   <div class="meta"><div class="n" id="entries">0</div><div class="t">Profit Calls / Entries</div></div>
   <div class="rollLayer" id="layer"><div class="rolling" id="rollLabel">ROLLING WINNER</div><div class="ticker pulse" id="ticker">—</div><div class="prize" id="prize"></div></div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s); const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let prevRolling=false,seenWinner=0,spinTimer=null,last=[];
function startTicker(names){clearInterval(spinTimer);let i=0;$('#ticker').className='ticker pulse';$('#rollLabel').textContent='ROLLING WINNER';$('#prize').textContent='';spinTimer=setInterval(()=>{if(names.length)$('#ticker').textContent=names[i++%names.length]},85)}
function showWinner(w){clearInterval(spinTimer);$('#layer').classList.add('show');$('#rollLabel').textContent='POT WINNER';$('#ticker').className='ticker winner';$('#ticker').textContent=w.name;$('#prize').textContent=`WINS $${money(w.prize)}`;setTimeout(()=>{if(!prevRolling)$('#layer').classList.remove('show')},8500)}
async function tick(){try{const s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());$('#pot').textContent=money(s.pot);$('#entries').textContent=s.entryCount;last=s.calls.map(c=>c.name);if(s.rolling&&!prevRolling){$('#layer').classList.add('show');startTicker(last)}if(!s.rolling&&prevRolling&&s.winner)showWinner(s.winner);if(!s.rolling&&s.winner&&s.winner.wonAt!==seenWinner){seenWinner=s.winner.wonAt;showWinner(s.winner)}if(!s.rolling&&!s.winner)$('#layer').classList.remove('show');prevRolling=s.rolling}catch(e){}}
setInterval(tick,500);tick();
</script>
</body>
</html>
